[package]
name = "imge"
version = "1.1.0"
edition = "2024"
description = "TUI for copying disk images to/from drives - a less error-prone alternative to dd."
readme = "README.md"
repository = "https://github.com/gblach/imge"
license = "MPL-2.0"
keywords = ["cli", "filesystem", "linux", "tool", "tui"]
categories = ["command-line-utilities", "filesystem", "hardware-support"]

[dependencies]
anyhow = "1"
argp = "0.4"
bzip2 = "0.6"
crossterm = "0.29"
drives = "0.6"
flate2 = "1"
liblzma = { version = "0.4", features = ["static"] }
num-format = { version = "0.4", features = ["with-system-locale"] }
ratatui = "0.30"
roxmltree = "0.21"
rustix = { version = "1", features = ["fs"] }
scopeguard = "1"
sha1 = "0.11"
sha2 = "0.11"
zstd = "0.14"

[profile.release]
strip = "symbols"
lto = "thin"
